    <path d="M 19 79 L 26 81" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Front Leg -->
    <path d="M 54 66 L 68 77 L 76 71 L 62 60 Z" fill="#222222"/>
    <path d="M 68 75 L 78 83 C 82 85 86 81 82 76 L 75 70 Z" fill="#F20000"/>
    <path d="M 76 82 L 83 78" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

    <!-- Hooded Sweatshirt -->
    <path d="M 35 44 C 35 44 48 40 58 44 C 64 46 68 54 64 66 C 58 70 44 70 38 66 C 33 56 35 44 35 44 Z" fill="#161616" stroke="#2D2D2D" stroke-width="1.5"/>
