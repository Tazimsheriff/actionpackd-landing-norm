<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#0A0A0A" />
    </linearGradient>
    <linearGradient id="hb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF1A1A" />
      <stop offset="100%" stop-color="#C00000" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="22" fill="url(#bg-grad)"/>
  <rect x="1.5" y="1.5" width="97" height="97" rx="20.5" stroke="#F20000" stroke-opacity="0.4" stroke-width="2"/>
  
  <g transform="translate(-2, 2)">
    <!-- Red headband ribbon tails -->
    <path d="M 24 35 C 12 30 8 26 3 28 C 1 29 6 35 15 37 C 21 39 23 40 25 40 Z" fill="url(#hb-grad)"/>
    <path d="M 24 37 C 11 41 7 45 2 47 C 1 49 8 48 17 44 C 21 41 23 41 25 40 Z" fill="#990000"/>

    <!-- Back Leg -->
    <path d="M 42 66 L 30 77 L 24 73 L 36 62 Z" fill="#1A1A1A"/>
