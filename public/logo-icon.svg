    <!-- Left Arm -->
    <path d="M 37 48 L 27 56 L 31 60 L 39 52 Z" fill="#1A1A1A"/>
    <circle cx="26" cy="58" r="3.5" fill="#FFCBB3"/>

    <!-- Right Arm Thumbs Up -->
    <path d="M 57 48 L 71 42 L 75 47 L 61 53 Z" fill="#202020"/>
    <path d="M 71 40 C 71 35 74 33 76 35 C 77 36 76 40 76 42 L 79 42 C 81 42 82 44 80 46 L 77 47 C 79 48 79 50 77 51 L 72 49 Z" fill="#FFCBB3"/>

    <!-- Head & Skin -->
    <circle cx="51" cy="32" r="13.5" fill="#FFCBB3"/>

    <!-- Hair -->
    <path d="M 35 30 C 33 20 41 14 49 14 C 57 12 67 16 69 26 C 67 20 61 18 53 18 C 45 18 37 22 35 30 Z" fill="#0F0F0F"/>
    <path d="M 39 20 L 35 12 L 45 16 L 51 8 L 57 16 L 67 10 L 65 20 Z" fill="#1A1A1A"/>

    <!-- Red Headband -->
    <path d="M 36 26 C 44 24 57 24 66 28 L 65 33 C 57 29 44 29 37 31 Z" fill="url(#hb-grad)"/>

    <!-- Face -->
    <ellipse cx="57" cy="32" rx="2.5" ry="3.5" fill="#0D0D0D"/>
    <ellipse cx="58" cy="31" rx="1" ry="1" fill="#FFFFFF"/>
    <ellipse cx="46" cy="33" rx="2" ry="3" fill="#0D0D0D"/>
    <path d="M 49 38 C 52 41 56 40 58 37" stroke="#0D0D0D" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
